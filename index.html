<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Evals research citation map</title>
<style>
  :root{
    --ground:#FBFAF8; --panel:#FFFFFF; --line:#D9DFE4; --line-soft:#ECEFF2;
    --paper:#1F2933;                  /* body ink; name kept so rules below still read */
    --muted:#5C6B78;
    --bridge:#1F2933; --fresh:#0F7A52;
    --serif: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, ui-serif, serif;
    --sans: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  *{box-sizing:border-box}
  #wrap{background:var(--ground);color:var(--paper);font-family:var(--sans);
    display:grid;grid-template-columns:1fr 340px;height:760px;max-height:88vh;
    border:1px solid var(--line);overflow:hidden;position:relative}
  /* The chips take three rows here, so the canvas needs the extra height back */
  @media (max-width:820px){#wrap{grid-template-columns:1fr;grid-template-rows:1fr 290px;
    height:820px;max-height:none}}

  /* ---- canvas side ---- */
  #stage{position:relative;overflow:hidden}
  canvas{display:block;width:100%;height:100%;cursor:grab}
  canvas.dragging{cursor:grabbing}

  #controls{position:absolute;top:0;left:0;right:0;padding:14px 16px;
    display:flex;gap:8px;flex-wrap:wrap;align-items:center;
    background:linear-gradient(180deg,rgba(251,250,248,.97) 60%,rgba(251,250,248,0));
    pointer-events:none}
  #controls > *{pointer-events:auto}
  .chip{background:#fff;border:1px solid var(--line);color:var(--muted);
    font:inherit;font-size:12px;padding:5px 10px;border-radius:3px;cursor:pointer;
    display:inline-flex;align-items:center;gap:7px}
  .chip:hover{border-color:var(--muted);color:var(--paper)}
  .chip:focus-visible{outline:2px solid var(--bridge);outline-offset:2px}
  /* --c is set from map.json at boot, so cluster colour has a single source */
  .chip[aria-pressed="true"]{color:var(--paper);border-color:currentColor}
  .dot{width:8px;height:8px;border-radius:50%;background:currentColor;flex:none;
    box-shadow:0 0 0 1px rgba(31,41,51,.14)}
  .chip[data-cluster][aria-pressed="true"]{color:var(--c);border-color:var(--c);
    background:color-mix(in srgb, var(--c) 7%, #fff)}
  .chip[data-cluster][aria-pressed="false"] .dot{background:var(--line)}
  .chip.bridge[aria-pressed="true"]{color:#fff;background:var(--bridge);border-color:var(--bridge)}
  .chip.newchip[aria-pressed="true"]{color:#fff;background:var(--fresh);border-color:var(--fresh)}
  #find{background:#fff;border:1px solid var(--line);color:var(--paper);
    font:inherit;font-size:12px;padding:5px 9px;border-radius:3px;width:150px}
  #find::placeholder{color:var(--muted)}
  #find:focus{outline:none;border-color:var(--bridge)}

  #stamp{position:absolute;right:16px;bottom:14px;font-size:11px;color:var(--muted);pointer-events:none}
  #readout{position:absolute;left:16px;bottom:14px;font-size:11px;color:var(--muted);
    letter-spacing:.02em;pointer-events:none}
  /* Narrow: the two footer lines ran into each other, and four rows of chips
     ate the canvas. Stack the footer, tighten the chips. */
  @media (max-width:820px){
    #stamp{right:auto;left:16px;bottom:30px}
    .chip{font-size:11px;padding:4px 8px;gap:5px}
    #controls{padding:10px 12px;gap:6px}
    #find{width:112px}
  }

  /* ---- detail panel ---- */
  #side{background:var(--panel);border-left:1px solid var(--line);
    padding:20px;overflow-y:auto}
  @media (max-width:820px){#side{border-left:none;border-top:1px solid var(--line);padding:16px}}
  #side h1{font-family:var(--serif);font-size:19px;line-height:1.32;font-weight:500;
    margin:0 0 10px;color:var(--paper)}
  #side .meta{font-size:12px;color:var(--muted);line-height:1.6;margin:0 0 4px}
  #side .authors{font-size:12.5px;color:var(--muted);line-height:1.55;margin:0 0 12px}
  #side .tag{display:inline-block;font-size:11px;padding:3px 8px;border:1px solid currentColor;
    border-radius:3px;margin:0 6px 14px 0}
  #side p.note{font-size:12.5px;line-height:1.65;color:#33414E;
    border-left:2px solid var(--line);padding-left:11px;margin:0 0 16px}
  #side a.src{font-size:12px;color:#0E6E8C;text-decoration:none;border-bottom:1px solid rgba(14,110,140,.4)}
  #side a.src:hover{border-bottom-color:#0E6E8C}
  .grouphead{font-size:11px;color:var(--muted);margin:18px 0 8px;
    border-top:1px solid var(--line-soft);padding-top:12px}
  .ref{display:block;width:100%;text-align:left;background:none;border:none;
    color:var(--paper);font:inherit;font-size:12.5px;line-height:1.45;padding:5px 0 5px 12px;
    cursor:pointer;position:relative;border-radius:3px}
  .ref:hover{background:var(--line-soft)}
  .ref::before{content:"";position:absolute;left:0;top:11px;width:5px;height:5px;
    border-radius:50%;background:currentColor;opacity:.55}
  .ref.dashed::before{border-radius:0;height:1px;width:7px;top:13px}
  #empty{color:#44525E;font-size:13px;line-height:1.7}
  #empty b{color:var(--paper);font-weight:500;font-family:var(--serif);font-size:15px;
    display:block;margin-bottom:9px}
  #empty .key{display:inline-flex;align-items:center;gap:6px;margin:2px 0}
  #empty .swatch{width:22px;height:0;border-top:2px solid var(--bridge);flex:none}
  #empty .swatch.soft{border-top:1px solid #7C8B99}
  #empty .swatch.dash{border-top:1px dashed #7C8B99}
  kbd{font:inherit;font-size:11px;border:1px solid var(--line);padding:1px 5px;border-radius:3px;color:var(--muted)}
</style>

<div id="wrap">
  <div id="stage">
    <canvas id="cv"></canvas>
    <div id="controls">
      <button class="chip c-eval"   aria-pressed="true" data-cluster="eval"><i class="dot"></i>Evaluation methodology</button>
      <button class="chip c-interp" aria-pressed="true" data-cluster="interp"><i class="dot"></i>Mech. interpretability</button>
      <button class="chip c-rl"     aria-pressed="true" data-cluster="rl"><i class="dot"></i>RL &amp; reward hacking</button>
      <button class="chip c-human"  aria-pressed="true" data-cluster="human"><i class="dot"></i>Human&ndash;AI interaction</button>
      <button class="chip bridge"   aria-pressed="false" id="bridgeBtn">Bridges only</button>
      <button class="chip newchip"  aria-pressed="false" id="newBtn">New arrivals</button>
      <input id="find" placeholder="Find a paper" autocomplete="off">
    </div>
    <div id="readout"></div>
      <div id="stamp"></div>
  </div>
  <div id="side">
    <div id="empty"></div>
  </div>
</div>

<script>
/* Graph data lives in data/map.json so the weekly job edits data, not code. */
let CLUSTERS, NODES, EDGES;
async function loadMap(){
  const res = await fetch('./data/map.json?v=' + Date.now());
  if (!res.ok) throw new Error('map.json ' + res.status);
  const d = await res.json();
  CLUSTERS = d.clusters;
  NODES = d.nodes;
  EDGES = d.edges.map(e => [e.source, e.target, e.confidence]);
  return d;
}

async function boot(){
const meta = await loadMap();
/* ---------- indices ---------- */
const byId = {}; NODES.forEach(n => byId[n.id] = n);
const out = {}, inn = {};
NODES.forEach(n => { out[n.id] = []; inn[n.id] = []; });
const edges = EDGES.filter(e => byId[e[0]] && byId[e[1]]).map(([s,t,k]) => {
  out[s].push({id:t,k}); inn[t].push({id:s,k});
  return {s, t, k, cross: byId[s].c !== byId[t].c};
});
// a bridge node is one with a real citation link crossing a cluster boundary
const bridge = {};
edges.forEach(e => { if (e.cross) { bridge[e.s] = true; bridge[e.t] = true; } });
NODES.forEach(n => { n.deg = out[n.id].length + inn[n.id].length; n.bridge = !!bridge[n.id]; });

/* ---------- layout ---------- */
const cv = document.getElementById("cv"), ctx = cv.getContext("2d");
const stage = document.getElementById("stage");
const controlsEl = document.getElementById("controls");
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
let W = 0, H = 0, dpr = 1;

NODES.forEach((n,i) => {
  const a = CLUSTERS[n.c].anchor, ang = i * 2.39996;
  /* px/py, not x/y: node.y is the publication year from map.json and the layout
     would overwrite it, which is what put floats in the node labels. */
  n.px = a[0] + Math.cos(ang) * .05; n.py = a[1] + Math.sin(ang) * .05; // normalised 0..1
  n.vx = n.vy = 0;
});

function size(){
  const r = stage.getBoundingClientRect();
  dpr = Math.min(devicePixelRatio || 1, 2);
  W = r.width; H = r.height;
  cv.width = W * dpr; cv.height = H * dpr;
  ctx.setTransform(dpr,0,0,dpr,0,0);
}

/* Repulsion is inverse-square in normalised 0..1 coordinates, so REP has to sit
   near the spring/gravity force scale (~1e-3) at a typical separation of ~0.16.
   MIND floors the denominator: nodes seeded within .05 of a cluster anchor — and
   the up-to-8 the weekly job adds — would otherwise produce a near-zero d2, kick
   each other a full canvas width in one frame, and pin the graph to the clamps. */
const REP = 0.000008, SPR = 0.0075, GRAV = 0.010, DAMP = 0.86, MIND = 0.045;
function step(){
  for (let i = 0; i < NODES.length; i++){
    const p = NODES[i];
    for (let j = i+1; j < NODES.length; j++){
      const q = NODES[j];
      let dx = q.px - p.px, dy = q.py - p.py, d2 = dx*dx + dy*dy + 1e-5;
      const d = Math.sqrt(d2), de = Math.max(d, MIND), f = REP / (de * de);
      const ux = dx/d, uy = dy/d;
      p.vx -= ux*f; p.vy -= uy*f; q.vx += ux*f; q.vy += uy*f;
    }
  }
  edges.forEach(e => {
    const p = byId[e.s], q = byId[e.t];
    const dx = q.px - p.px, dy = q.py - p.py, d = Math.hypot(dx,dy) + 1e-5;
    const rest = e.cross ? .21 : .13;
    const f = (d - rest) * SPR, ux = dx/d, uy = dy/d;
    p.vx += ux*f; p.vy += uy*f; q.vx -= ux*f; q.vy -= uy*f;
  });
  NODES.forEach(n => {
    const a = CLUSTERS[n.c].anchor;
    n.vx += (a[0] - n.px) * GRAV; n.vy += (a[1] - n.py) * GRAV;
    if (n === held) return;
    n.vx *= DAMP; n.vy *= DAMP;
    n.px += n.vx; n.py += n.vy;
    n.px = Math.max(.05, Math.min(.95, n.px));
    n.py = Math.max(.06, Math.min(.95, n.py));
  });
}

/* ---------- state ---------- */
const on = {eval:1, interp:1, rl:1, human:1};
let bridgesOnly = false, newOnly = false, sel = null, hov = null, held = null, query = "";
const visible = n => on[n.c] && (!bridgesOnly || n.bridge) && (!newOnly || n.isNew) &&
  (!query || (n.t + " " + n.a).toLowerCase().includes(query));

const PX = n => [n.px * W, n.py * H];
/* Wider than it was (4.2–10.7): degree is one of only two things size and
   colour can carry, so it needs enough range to actually be read. */
const rad = n => 5 + Math.min(n.deg, 10) * 1.15;

/* Canvas cannot read CSS variables, so pull the palette once. */
const CSSV = getComputedStyle(document.documentElement);
const C = {};
["ground","paper","muted","line","bridge","fresh"].forEach(k =>
  C[k] = CSSV.getPropertyValue("--" + k).trim());

/* Surnames: authors arrive as "Bricken, Templeton" from the curated rows but
   as "Jihyeon Kim, Hanyong Lee" from Semantic Scholar, so taking the first
   token labelled new papers with a given name. Last token is right for both. */
const surname = a => (a || "?").split(",")[0].trim().split(/\s+/).pop();

/* Five nodes carry a = "authors not verified", which surname() turned into the
   word "verified" — six labels on the map all reading "verified 2026". With no
   usable author, fall back to the head of the title. */
const LABEL = n => {
  const a = (n.a || "").trim();
  if (a && !/not verified/i.test(a)) return surname(a) + " " + n.y;
  const head = (n.t || "?").split(/[:—–]/)[0].trim().split(/\s+/).slice(0,2).join(" ");
  return (head.length > 19 ? head.slice(0,18) + "…" : head) + " " + n.y;
};

function nbrs(id){
  const s = new Set([id]);
  out[id].forEach(o => s.add(o.id)); inn[id].forEach(o => s.add(o.id));
  return s;
}

/* ---------- draw ---------- */

/* The four literatures were previously carried by dot colour alone, so the
   clusters were not visible as regions at all. One soft disc per node, laid
   down at low alpha, accumulates into an organic territory that also reads
   denser where the cluster is denser. */
/* A hard-edged disc per node left visible scalloping where they overlapped, so
   each is a pre-rendered radial falloff instead. Built once, not per frame. */
const BLOB = 168;
const blobs = {};
function makeBlob(hex){
  const c = document.createElement("canvas"); c.width = c.height = BLOB;
  const g = c.getContext("2d");
  const m = /^#?([\da-f]{2})([\da-f]{2})([\da-f]{2})$/i.exec(hex);
  const rgb = m ? [1,2,3].map(i => parseInt(m[i],16)).join(",") : "120,120,120";
  const grd = g.createRadialGradient(BLOB/2,BLOB/2,0,BLOB/2,BLOB/2,BLOB/2);
  grd.addColorStop(0, `rgba(${rgb},1)`);
  grd.addColorStop(.55, `rgba(${rgb},.45)`);
  grd.addColorStop(1, `rgba(${rgb},0)`);
  g.fillStyle = grd; g.fillRect(0,0,BLOB,BLOB);
  return c;
}

function drawTerritories(){
  ctx.save();
  ctx.globalAlpha = 0.085;
  Object.entries(CLUSTERS).forEach(([key, cl]) => {
    const sprite = blobs[key] || (blobs[key] = makeBlob(cl.color));
    NODES.forEach(n => {
      if (n.c !== key || !visible(n)) return;
      const [x,y] = PX(n);
      ctx.drawImage(sprite, x - BLOB/2, y - BLOB/2);
    });
  });
  ctx.restore();
}

function drawTerritoryLabels(){
  // Below this the names are wider than the space they'd sit in, and they
  // collided with each other and the footer. The chips already name the
  // clusters, so on a phone the on-canvas copy is redundant.
  if (W < 560) return;
  ctx.save();
  ctx.font = '600 11px ' + 'system-ui, sans-serif';
  ctx.textAlign = "center"; ctx.textBaseline = "middle";
  Object.entries(CLUSTERS).forEach(([key, cl]) => {
    const pts = NODES.filter(n => n.c === key && visible(n)).map(PX);
    if (pts.length < 2) return;
    // push the name out towards this cluster's own corner, clear of the nodes
    const ax = cl.anchor[0] * W, ay = cl.anchor[1] * H;
    const sx = Math.sign(cl.anchor[0] - .5) || 1, sy = Math.sign(cl.anchor[1] - .5) || 1;
    const text = cl.name.toUpperCase();
    const half = ctx.measureText(text).width / 2 + 6;
    const lx = Math.max(half, Math.min(W - half, ax + sx * 96));
    const top = (controlsEl.offsetHeight || 44) + 22;
    const ly = Math.max(top, Math.min(H - 50, ay + sy * 104));  // clear the footer
    // reserved before any node label is placed, so the region name always wins
    const w = ctx.measureText(text).width;
    placedLabels.push({x: lx - w/2 - 4, y: ly - 8, w: w + 8, h: 16});
    ctx.lineWidth = 3.5; ctx.strokeStyle = C.ground; ctx.lineJoin = "round";
    ctx.strokeText(text, lx, ly);
    ctx.globalAlpha = .62; ctx.fillStyle = cl.color;
    ctx.fillText(text, lx, ly); ctx.globalAlpha = 1;
  });
  ctx.restore();
}

const QP = (t,a,b,c) => (1-t)*(1-t)*a + 2*(1-t)*t*b + t*t*c;

/* This is a citation map, so which way an edge points is the actual content.
   It was previously carried by nothing at all. */
function arrowhead(x1,y1,mx,my,x2,y2,stopR,color,alpha){
  let t = 0.55;
  for (let s = 1; s > 0.3; s -= 0.02){
    const bx = QP(s,x1,mx,x2), by = QP(s,y1,my,y2);
    if (Math.hypot(bx - x2, by - y2) >= stopR){ t = s; break; }
  }
  const bx = QP(t,x1,mx,x2), by = QP(t,y1,my,y2);
  const tx = 2*(1-t)*(mx-x1) + 2*t*(x2-mx);
  const ty = 2*(1-t)*(my-y1) + 2*t*(y2-my);
  const a = Math.atan2(ty, tx), L = 6.5, Wd = 3.4;
  ctx.save();
  ctx.globalAlpha = alpha; ctx.fillStyle = color;
  ctx.translate(bx, by); ctx.rotate(a);
  ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(-L, Wd); ctx.lineTo(-L, -Wd);
  ctx.closePath(); ctx.fill();
  ctx.restore();
}

/* Greedy label placement: labels are the difference between a map you can
   read and a field of anonymous dots, but they have to not overlap. */
const placedLabels = [];
function tryLabel(text, x, y, r, color, alpha, bold){
  ctx.font = (bold ? '600 ' : '') + '11px system-ui, sans-serif';
  const w = ctx.measureText(text).width, h = 12;
  const cx = Math.max(w/2 + 5, Math.min(W - w/2 - 5, x));   // keep it on canvas
  const bx = cx - w/2 - 2, by = y - r - 7 - h, bw = w + 4, bh = h + 2;
  if (by < 4) return false;
  for (const p of placedLabels)
    if (bx < p.x + p.w && bx + bw > p.x && by < p.y + p.h && by + bh > p.y) return false;
  placedLabels.push({x:bx, y:by, w:bw, h:bh});
  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.textAlign = "center"; ctx.textBaseline = "alphabetic";
  ctx.lineWidth = 3.5; ctx.strokeStyle = C.ground; ctx.lineJoin = "round";
  ctx.strokeText(text, cx, y - r - 7);         // halo, so text survives hulls
  ctx.fillStyle = color; ctx.fillText(text, cx, y - r - 7);
  ctx.restore();
  return true;
}

function draw(){
  ctx.fillStyle = C.ground; ctx.fillRect(0,0,W,H);
  const focus = hov || sel;
  const near = focus ? nbrs(focus) : null;

  // Reserve before anything is placed: the controls bar, then the region
  // names, so node labels are pushed out of both rather than colliding.
  placedLabels.length = 0;
  // measured, not guessed: the chips wrap to four rows on a phone and were
  // hiding the top of the graph behind themselves
  placedLabels.push({x:0, y:0, w:W, h:(controlsEl.offsetHeight || 44) + 6});

  drawTerritories();
  drawTerritoryLabels();

  edges.forEach(e => {
    const p = byId[e.s], q = byId[e.t];
    if (!visible(p) || !visible(q)) return;
    const lit = !focus || (near.has(e.s) && near.has(e.t));
    const [x1,y1] = PX(p), [x2,y2] = PX(q);
    const a = e.cross ? (lit ? .50 : .07) : (lit ? .32 : .05);
    const col = e.cross ? "31,41,51" : "104,122,136";
    ctx.save();
    ctx.setLineDash(e.k === "l" ? [3,4] : []);
    ctx.lineWidth = e.cross ? 1.6 : 1;
    ctx.strokeStyle = `rgba(${col},${a})`;
    // slight arc so reciprocal directions stay legible
    const mx = (x1+x2)/2 + (y2-y1)*.055, my = (y1+y2)/2 - (x2-x1)*.055;
    ctx.beginPath(); ctx.moveTo(x1,y1); ctx.quadraticCurveTo(mx,my,x2,y2); ctx.stroke();
    ctx.restore();
    arrowhead(x1,y1,mx,my,x2,y2, rad(q) + 3.5, `rgb(${col})`, a * 1.25);
  });

  NODES.forEach(n => {
    if (!visible(n)) return;
    const lit = !focus || near.has(n.id);
    const [x,y] = PX(n), r = rad(n), col = CLUSTERS[n.c].color;
    ctx.globalAlpha = lit ? 1 : .18;
    if (n.id === sel){
      ctx.beginPath(); ctx.arc(x,y,r+7.5,0,6.2832);
      ctx.strokeStyle = col; ctx.lineWidth = 1.5; ctx.stroke();
    }
    ctx.beginPath(); ctx.arc(x,y,r,0,6.2832);
    ctx.fillStyle = col; ctx.fill();
    ctx.lineWidth = 1.5; ctx.strokeStyle = C.ground; ctx.stroke();  // lift off the hull
    if (n.bridge){                                  // the papers the map is for
      ctx.beginPath(); ctx.arc(x,y,r+3.4,0,6.2832);
      ctx.strokeStyle = C.bridge; ctx.globalAlpha = lit ? .6 : .1;
      ctx.lineWidth = 1.3; ctx.stroke(); ctx.globalAlpha = lit ? 1 : .18;
    }
    if (n.isNew){
      ctx.beginPath(); ctx.arc(x,y,r + (n.bridge ? 6.8 : 3.4),0,6.2832);
      ctx.setLineDash([2,2.4]);
      ctx.strokeStyle = C.fresh; ctx.lineWidth = 1.6; ctx.stroke();
      ctx.setLineDash([]);
    }
    ctx.globalAlpha = 1;
  });

  // labels last, so they sit above every mark.
  // A phone canvas cannot carry 47 labels; spend the budget on the ones the
  // priority sort puts first (selected, its neighbours, bridges, high degree).
  let budget = Math.max(8, Math.round(W * H / 9000));
  NODES.filter(visible).map(n => {
    let pri = n.deg;
    if (n.id === sel) pri += 1000;
    else if (focus && near.has(n.id)) pri += 500;
    if (n.bridge) pri += 20;
    if (n.isNew) pri += 10;
    return {n, pri};
  }).sort((a,b) => b.pri - a.pri).forEach(({n}) => {
    if (budget <= 0) return;
    const lit = !focus || near.has(n.id);
    if (focus && !lit) return;                 // don't label what we dimmed
    const [x,y] = PX(n);
    if (tryLabel(LABEL(n), x, y, rad(n), C.paper, lit ? .95 : .3, n.bridge)) budget--;
  });

  const shown = NODES.filter(visible).length;
  document.getElementById("readout").textContent =
    shown + " of " + NODES.length + " papers · " +
    edges.filter(e => e.cross).length + " cross-cluster links · " +
    NODES.filter(n => n.bridge).length + " bridge papers";
}

let alpha = 1;
function loop(){
  const iters = reduce ? 1 : (alpha > .02 ? 3 : 1);
  for (let k = 0; k < iters; k++) step();
  alpha *= .997;
  draw();
  requestAnimationFrame(loop);
}

/* ---------- hit testing & interaction ---------- */
function at(mx,my){
  let best = null, bd = 18*18;
  NODES.forEach(n => {
    if (!visible(n)) return;
    const [x,y] = PX(n), d = (x-mx)**2 + (y-my)**2;
    if (d < bd){ bd = d; best = n; }
  });
  return best;
}
function pos(ev){
  const r = cv.getBoundingClientRect();
  const t = ev.touches ? ev.touches[0] : ev;
  return [t.clientX - r.left, t.clientY - r.top];
}
cv.addEventListener("pointermove", ev => {
  const [mx,my] = pos(ev);
  if (held){ held.px = Math.max(.05,Math.min(.95,mx/W)); held.py = Math.max(.06,Math.min(.95,my/H)); held.vx = held.vy = 0; return; }
  const n = at(mx,my); const id = n ? n.id : null;
  if (id !== hov){ hov = id; cv.style.cursor = id ? "pointer" : "grab"; }
});
cv.addEventListener("pointerdown", ev => {
  const [mx,my] = pos(ev); const n = at(mx,my);
  if (n){ held = n; cv.classList.add("dragging"); cv.setPointerCapture(ev.pointerId); open(n.id); alpha = Math.max(alpha,.4); }
});
addEventListener("pointerup", () => { held = null; cv.classList.remove("dragging"); });
cv.addEventListener("pointerleave", () => { if (!held) hov = null; });

/* ---------- panel ---------- */
const side = document.getElementById("side");
function open(id){
  sel = id;
  const n = byId[id], col = CLUSTERS[n.c].color;
  const refs = (list, dashLabel) => list.map(o => {
    const m = byId[o.id];
    return `<button class="ref ${o.k==='l'?'dashed':''}" data-go="${o.id}" style="color:${CLUSTERS[m.c].color}">
      ${m.a.split(",")[0]} ${m.y} &mdash; <span style="color:var(--paper)">${m.t}</span></button>`;
  }).join("") || `<div style="font-size:12px;color:var(--muted)">None recorded in this map.</div>`;

  side.innerHTML = `
    <h1>${n.t}</h1>
    <div class="authors">${n.a}</div>
    <div class="meta">${n.v} &middot; ${n.y}</div>
    <span class="tag" style="color:${col}">${CLUSTERS[n.c].name}</span>
    ${n.bridge ? `<span class="tag" style="color:var(--bridge)">bridge</span>` : ``}
    ${n.isNew ? `<span class="tag" style="color:var(--fresh)">added ${n.added || "this run"}</span>` : ``}
    <p class="note">${n.n}</p>
    ${n.url ? `<a class="src" href="${n.url}" target="_blank" rel="noopener">Open source</a>` : ``}
    <div class="grouphead">Cites (${out[id].length})</div>${refs(out[id])}
    <div class="grouphead">Cited by, within this map (${inn[id].length})</div>${refs(inn[id])}
    <div class="grouphead">&nbsp;</div>
    <div style="font-size:11.5px;color:var(--muted);line-height:1.6">
      Dashes mark links I could not verify in the citing text.
    </div>`;
  side.scrollTop = 0;
  side.querySelectorAll("[data-go]").forEach(b =>
    b.addEventListener("click", () => { const t = b.dataset.go; on[byId[t].c] = 1; syncChips(); open(t); alpha = Math.max(alpha,.3); }));
}

/* ---------- controls ---------- */
function syncChips(){
  document.querySelectorAll("[data-cluster]").forEach(b =>
    b.setAttribute("aria-pressed", on[b.dataset.cluster] ? "true" : "false"));
}
document.querySelectorAll("[data-cluster]").forEach(b => b.addEventListener("click", () => {
  on[b.dataset.cluster] = on[b.dataset.cluster] ? 0 : 1; syncChips(); alpha = Math.max(alpha,.3);
}));
const bb = document.getElementById("bridgeBtn");
bb.addEventListener("click", () => {
  bridgesOnly = !bridgesOnly;
  bb.setAttribute("aria-pressed", bridgesOnly ? "true" : "false");
  alpha = Math.max(alpha,.5);
});
const nb = document.getElementById("newBtn");
nb.addEventListener("click", () => {
  newOnly = !newOnly;
  nb.setAttribute("aria-pressed", newOnly ? "true" : "false");
  alpha = Math.max(alpha,.5);
});
document.getElementById("find").addEventListener("input", e => {
  query = e.target.value.trim().toLowerCase(); alpha = Math.max(alpha,.3);
});

/* Cluster colour is defined once, in map.json; the chips read it from there
   rather than keeping a second copy in the stylesheet that can drift. */
document.querySelectorAll("[data-cluster]").forEach(b => {
  const cl = CLUSTERS[b.dataset.cluster];
  if (!cl) return;
  b.style.setProperty("--c", cl.color);
  b.lastChild.textContent = cl.name.replace(" & design", "");
});

/* Built from the data, so it cannot go stale the way the hardcoded
   "39 papers, 47 citation links" did. */
const nBridge = NODES.filter(n => n.bridge).length;
const nCross = edges.filter(e => e.cross).length;
document.getElementById("empty").innerHTML = `
  <b>${NODES.length} papers, ${edges.length} citation links</b>
  Click any node to read it and walk its references. Drag to rearrange, hover
  to isolate a neighbourhood.
  <br><br>
  Arrows point from the citing paper to the paper it cites. Tinted regions are
  the ${Object.keys(CLUSTERS).length} literatures.
  <div style="margin:14px 0 0">
    <div class="key"><i class="swatch"></i> crosses a cluster boundary (${nCross})</div>
    <div class="key"><i class="swatch soft"></i> citation confirmed in the citing text</div>
    <div class="key"><i class="swatch dash"></i> standard lineage, unverified &mdash; provisional</div>
  </div>
  <br>
  Nodes ringed in dark cite across cluster boundaries. Those ${nBridge} papers
  are what join the ${Object.keys(CLUSTERS).length} literatures into one.
  Node size is how many links a paper has in this map.`;

addEventListener("resize", () => { size(); alpha = Math.max(alpha,.3); });
size();
for (let i = 0; i < 320; i++) step();   // settle before first paint
loop();

document.getElementById("stamp").textContent = "data updated " + meta.updated;
}
boot().catch(err => {
  document.getElementById("side").innerHTML = '<div id="empty"><b>Could not load the map</b>' +
    'data/map.json did not load (' + err.message + '). If you are opening this file directly from disk, ' +
    'browsers block the fetch. Serve the folder over HTTP instead, or view the published Pages site.</div>';
});
</script>
